[project]
name = "speech-emotion-recognition-ml-section"
version = "0.1.0"
description = "A speech emotion recognition project using machine learning techniques."
requires-python = ">=3.12"
dependencies = [
    "from-root>=1.3.0",
    "keras~=3.7.0",
    "librosa~=0.10.2.post1",
    "matplotlib~=3.9.3",
    "numpy~=2.0.2",
    "pandas~=2.2.3",
    "scikit-learn~=1.5.2",
    "scipy~=1.13.1",
    "tensorflow>=2.18.1",
    "tqdm~=4.67.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
